<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Marioflix</title>
<link rel="manifest" href="/static/manifest.webmanifest">
<link rel="apple-touch-icon" href="/static/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="mobile-web-app-capable" content="yes">
<style>
  * { box-sizing: border-box; }
  body { margin:0; font-family:Roboto,Arial,sans-serif; background:#121218; color:#fff;
         min-height:100vh; display:flex; align-items:center; justify-content:center; padding:24px; }
  .wrap { display:flex; gap:48px; max-width:860px; width:100%; align-items:center;
          flex-wrap:wrap; justify-content:center; }
  .play { color:#e52020; }
  h1 { font-size:40px; margin:0 0 8px; letter-spacing:.5px; }
  .tag { color:#888; font-size:14px; margin:0 0 26px; line-height:1.5; }
  .prices { background:#17171f; border:1px solid #26262f; border-radius:16px; padding:8px 0; }
  .row { display:flex; justify-content:space-between; align-items:center; gap:30px;
         padding:14px 20px; font-size:15px; color:#cfcfd8; }
  .row + .row { border-top:1px solid #22222b; }
  .pris { font-weight:700; color:#fff; font-size:16px; }
  .row.hot { background:rgba(229,32,32,.10); border-radius:10px; margin:0 8px;
             border:1px solid rgba(229,32,32,.45); }
  .row.hot .pris { color:#e52020; }
  .note { color:#666; font-size:12px; margin:14px 2px 0; }
  .login { background:#17171f; border:1px solid #26262f; border-radius:16px;
           padding:34px 30px; text-align:center; width:320px; }
  .login .sub { color:#888; margin:0 0 20px; font-size:14px; }
  input { background:#1e1e28; border:1px solid #333; color:#fff; font-size:18px; padding:12px 16px;
          border-radius:10px; width:220px; text-align:center; outline:none; }
  input:focus { border-color:#e52020; }
  button { margin-top:14px; background:#e52020; color:#fff; border:0; font-size:16px; font-weight:600;
           padding:12px 32px; border-radius:999px; width:220px; cursor:pointer; }
  .err { color:#ff6b6b; font-size:13px; min-height:18px; margin-top:12px; }
  @media (max-width: 640px) {
    .wrap { gap:28px; }
    .info { width:100%; text-align:center; }
    .row { justify-content:center; gap:16px; }
  }
</style>
</head>
<body>
  <div class="wrap">
    <div class="info">
      <h1><span class="play">Mario</span>flix</h1>
      <p class="tag">Streama filmer &amp; serier — när du vill, var du vill. 🎬</p>
      <div class="prices">
        <div class="row"><span>1 månad</span><span class="pris">149 kr</span></div>
        <div class="row"><span>1 år</span><span class="pris">1499 kr</span></div>
        <div class="row hot"><span>Livstidslicens</span><span class="pris">2449 kr</span></div>
      </div>
      <p class="note">Få din kod av Mario — välj det som passar dig bäst.</p>
    </div>
    <div class="login">
      <p class="sub">Ange din kod för att komma in</p>
      <input id="code" type="password" placeholder="Kod" autofocus>
      <br>
      <button onclick="tryLogin()">Logga in</button>
      <div class="err" id="err"></div>
    </div>
  </div>
  <script>
    function deviceId() {
      var id = localStorage.getItem('device_id');
      if (!id) {
        id = 'd-' + Math.random().toString(36).slice(2) + Date.now().toString(36);
        localStorage.setItem('device_id', id);
      }
      return id;
    }
    function tryLogin() {
      var code = document.getElementById('code').value.trim();
      if (!code) return;
      var err = document.getElementById('err');
      err.style.color = '#888';
      err.textContent = 'Kollar koden...';
      fetch('/check?code=' + encodeURIComponent(code) + '&device=' + encodeURIComponent(deviceId()))
        .then(function (r) { return r.json(); })
        .then(function (d) {
          if (d.ok) {
            err.style.color = '#6bff8b';
            err.textContent = 'Rätt kod! Öppnar filmerna...';
            setTimeout(function () { window.location.href = '/'; }, 600);
          } else if (d.reason === 'upptagen') {
            err.style.color = '#ff6b6b';
            err.textContent = 'Koden används redan på en annan enhet.';
          } else {
            err.style.color = '#ff6b6b';
            err.textContent = 'Fel kod, försök igen.';
          }
        })
        .catch(function () {
          err.style.color = '#ff6b6b';
          err.textContent = 'Kunde inte nå servern. Försök igen.';
        });
    }
    document.getElementById('code').addEventListener('keydown', function (e) {
      if (e.key === 'Enter') tryLogin();
    });
  </script>
</body>
</html>
